<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SiX-DOG ARCHIVE — 公演記録</title>
<meta name="description" content="名古屋のライブハウス SiX-DOG の公演記録アーカイブ" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div id="splash" class="splash" aria-hidden="true">
  <img src="img/six-dog-icon.jpg" alt="" class="splash-logo" />
</div>

<header class="topbar">
  <div class="inner">
    <a href="index.html" class="brand"><img src="img/six-dog-wordmark.png" alt="SiX-DOG" class="brand-wordmark" /> <span class="sub">ARCHIVE</span></a>
    <div class="tagline">名古屋のライブハウス「SiX-DOG」公演記録</div>
    <nav class="nav-tabs">
      <a href="index.html" class="active" aria-current="page">カレンダー</a>
      <a href="bi.html">BIダッシュボード</a>
      <a href="artists.html">アーティスト管理</a>
      <a href="event-groups.html">イベント管理</a>
      <a href="debug.html">デバッグ</a>
    </nav>
  </div>
</header>

<section id="yearHub" class="year-hub hidden">
  <p class="year-hub-lead">見たい年を選んでください</p>
  <div class="year-hub-grid" id="yearHubGrid"></div>
</section>

<div class="controls hidden" id="controls">
  <button type="button" class="back-to-years" id="backToYears">‹ 年を選び直す</button>
  <div class="search-wrap">
    <input id="search" type="text" placeholder="バンド名・イベント名で検索" autocomplete="off" />
  </div>
  <div class="month-nav">
    <button id="prevMonth" aria-label="前の月" type="button">‹</button>
    <select id="monthSelect" aria-label="表示する年月"></select>
    <button id="nextMonth" aria-label="次の月" type="button">›</button>
  </div>
  <div class="stats" id="stats"></div>
</div>

<main id="mainView" class="hidden">
  <section id="calendarView">
    <div class="cal-grid" id="calGrid"></div>
  </section>
  <section id="listView" class="list hidden"></section>
</main>

<div id="detailOverlay" class="overlay hidden">
  <div class="detail-card" id="detailCard"></div>
</div>

<footer>SiX-DOG Archive — 個人アーカイブプロジェクト</footer>

<script src="splash.js"></script>
<script src="editor.js"></script>
<script src="videos.js"></script>
<script src="tweets.js"></script>
<script src="event-links.js"></script>
<script src="event-groups.js"></script>
<script src="app.js"></script>
</body>
</html>
