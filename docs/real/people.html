  sp(0xff3a48, 90, -3, -6, -1.5); sp(0xfff0d8, 70, 0, -6.5, 0.5); sp(0x3a5cff, 90, 3.5, -6, 2); night.add(new THREE.HemisphereLight(0x20263a, 0x0c0a08, 0.7)); const b = new THREE.PointLight(0x5068ff, 6, 9, 2); b.position.set(0, 2.6, 4); night.add(b); }
night.visible = false;
const setLight = v => { day.visible = !v; night.visible = !!v; scene.background.set(v ? 0x020203 : 0x07080b); renderer.toneMappingExposure = v ? 1.3 : 1.1; document.querySelectorAll("[data-l]").forEach(b => b.classList.toggle("on", +b.dataset.l === v)); };
document.querySelectorAll("[data-l]").forEach(b => b.onclick = () => setLight(+b.dataset.l));

/* ---- 見る ---- */
let yaw = Math.PI, pitch = 0.1, dist = 6.6, drag = null, tx0 = -0.5;   // yaw = π で、ステージ側(体の正面の反対 = 後ろ)から
const view = v => { yaw = v ? 0 : Math.PI; document.querySelectorAll("[data-v]").forEach(b => b.classList.toggle("on", +b.dataset.v === v)); };
document.querySelectorAll("[data-v]").forEach(b => b.onclick = () => view(+b.dataset.v)); view(0);
const cv = renderer.domElement;
cv.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY, yaw, pitch }; });
addEventListener("pointermove", e => { if (!drag) return; yaw = drag.yaw - (e.clientX - drag.x) * 0.006; pitch = Math.max(-0.1, Math.min(0.7, drag.pitch + (e.clientY - drag.y) * 0.004)); });
addEventListener("pointerup", () => drag = null);
cv.addEventListener("wheel", e => { dist = Math.max(2.2, Math.min(10, dist + e.deltaY * 0.004)); });
function size() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = h > w ? 62 : 38; camera.updateProjectionMatrix(); }
addEventListener("resize", size); size();
renderer.setAnimationLoop(() => { camera.position.set(tx0 + Math.sin(yaw) * Math.cos(pitch) * dist, 1.0 + Math.sin(pitch) * dist, -Math.cos(yaw) * Math.cos(pitch) * dist); camera.lookAt(tx0, 0.95, 0); renderer.render(scene, camera); });
</script>
