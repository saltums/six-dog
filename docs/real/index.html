const pickG = (() => { const sh2 = new THREE.Shape(), r = 0.016; sh2.moveTo(0, -r * 1.25); sh2.quadraticCurveTo(r * 1.15, -r * 0.2, r * 0.95, r * 0.75); sh2.quadraticCurveTo(0, r * 1.25, -r * 0.95, r * 0.75); sh2.quadraticCurveTo(-r * 1.15, -r * 0.2, 0, -r * 1.25); return new THREE.ExtrudeGeometry(sh2, { depth: 0.0012, bevelEnabled: false, curveSegments: 8 }); })();
const ray = new THREE.Raycaster();
function throwPick(cx, cy) {

  const d = ray.ray.direction.clone(), m = new THREE.Mesh(pickG, new THREE.MeshStandardMaterial({ color: PICK_COL[thrown % PICK_COL.length], roughness: 0.35, envMapIntensity: 1 }));

  const power = 5.2 + Math.random() * 1.6; picks.push({ m, v: new THREE.Vector3(d.x * power, d.y * power + 2.6, d.z * power), w: new THREE.Vector3(Math.random() * 20 - 10, Math.random() * 24 - 12, Math.random() * 20 - 10), live: true });

}
function stepPicks(dt, t) { for (const k of picks) { if (!k.live) continue;
    k.v.y -= 9.8 * dt; k.v.multiplyScalar(1 - 0.35 * dt); k.m.position.addScaledVector(k.v, dt); k.m.rotation.x += k.w.x * dt; k.m.rotation.y += k.w.y * dt; k.m.rotation.z += k.w.z * dt;
    const p = k.m.position, ground = p.z < 3.7 ? SY : 0;

    if (p.y < 2.1 && p.y > 0.9) for (const o of people) if (Math.hypot(o.root.position.x - p.x, o.root.position.z - p.z) < 0.75) o.react = t + 1.4;
    if (p.x < 0.1 || p.x > 6.7) { k.v.x *= -0.3; p.x = Math.max(0.1, Math.min(6.7, p.x)); } if (p.z > 9.0) { k.v.z *= -0.3; p.z = 9.0; }
    if (p.y <= ground + 0.004) { p.y = ground + 0.004; if (Math.abs(k.v.y) > 1.2) { k.v.y *= -0.28; k.v.x *= 0.5; k.v.z *= 0.5; } else { k.live = false; k.m.rotation.set(-Math.PI / 2, 0, Math.random() * 6); } } } }

const clock = new THREE.Clock(); let frames = 0, last = performance.now(), baked = false;
/* ---- つい長居してしまう仕掛け ---- */
// 1) 当時のつぶやき(data/voices.json。当時の X の声を、名前を出さずに短く言い換えたもの)が、ときどき浮かんで消える
let voiceList = [], nextVoice = 0; const talking = [], recentV = [], vTmp = new THREE.Vector3();
function startVoices() { fetch("../data/voices.json").then(r => r.json()).then(vs => { voiceList = vs; nextVoice = performance.now() + 1500; }).catch(() => { /* 読めなくても困らない */ }); }
function headOnScreen(p) { p.hg.getWorldPosition(vTmp); vTmp.y += 0.24; const dist = Math.hypot(vTmp.x - EYE.x, vTmp.z - EYE.z); vTmp.project(camera);
  return { on: vTmp.z < 1 && Math.abs(vTmp.x) < 0.85 && vTmp.y < 0.9 && vTmp.y > -0.6, dist, x: (vTmp.x + 1) / 2 * innerWidth, y: (1 - vTmp.y) / 2 * innerHeight }; }
function updateVoices(now) { if (!voiceList.length) return; camera.updateMatrixWorld();
  if (now > nextVoice && talking.length < 3) { nextVoice = now + 1800 + Math.random() * 2200;
    const cand = people.filter(q => !talking.some(t => t.p === q)).map(q => ({ p: q, s: headOnScreen(q) })).filter(c => c.s.on && c.s.dist < 6.5);
    if (cand.length) { const c = cand[(Math.random() * cand.length) | 0]; let vi; for (let k = 0; k < 8; k++) { vi = (Math.random() * voiceList.length) | 0; if (!recentV.includes(vi)) break; }
      recentV.push(vi); if (recentV.length > Math.min(20, voiceList.length - 1)) recentV.shift();
      const v = voiceList[vi], el = document.createElement("div"), sm = document.createElement("small"); el.className = "voice"; el.textContent = v.t; sm.textContent = String(v.d || "").replace("-", "."); el.append(sm);
      $("#voices").appendChild(el); requestAnimationFrame(() => el.classList.add("on")); setTimeout(() => el.classList.add("on"), 60); talking.push({ p: c.p, el, until: now + 4200 }); } }
  for (let i = talking.length - 1; i >= 0; i--) { const t = talking[i], sc = headOnScreen(t.p); t.el.style.left = sc.x + "px"; t.el.style.top = sc.y + "px"; t.el.style.visibility = sc.on ? "visible" : "hidden";
    if (now > t.until) { t.el.classList.remove("on"); const el = t.el; setTimeout(() => el.remove(), 400); talking.splice(i, 1); } } }
// 3) 照明と客席が、流れている曲の音に合わせて動く(低い音の強さを測って、明るさと揺れに使う)
let pulse = 0; const spec = new Uint8Array(32);
function readPulse() { const m = music; if (!m.on || !m.an || m.el.paused) { pulse *= 0.9; return; } m.an.getByteFrequencyData(spec); let b = 0; for (let i = 1; i < 6; i++) b += spec[i]; b = b / 5 / 255; pulse = b > pulse ? pulse + (b - pulse) * 0.6 : pulse * 0.9; }

/* ---- 箱で流れている曲 ---- */
// music/music.json に並んだ曲を、順番をまぜて1曲ずつ流す(1曲 約1MB のモノラル MP3。読み込むのは流す曲だけ)。
// 立っている場所で聞こえ方を変える: ホールははっきり(前へ行くほど近い)、ドリンクカウンターは壁ごしにこもる
const music = { on: false, list: null, order: [], i: 0, el: null, ac: null, lp: null, gain: null, artist: "" };
const shuffle = n => { const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function playNext() { const m = music; if (!m.on || !m.list || !m.list.length) return;
  if (m.i >= m.order.length) { const last = m.order[m.order.length - 1]; m.order = shuffle(m.list.length); if (m.order.length > 1 && m.order[0] === last) m.order.push(m.order.shift()); m.i = 0; }   // 一巡したらまぜ直す(同じ曲が続かないように)
  const t = m.list[m.order[m.i++]]; m.el.src = "music/" + t.f; m.el.play().catch(() => { /* 鳴らせない端末では、表示だけ */ });
  m.label = `♪ ${t.t}（${t.a}）— ${m.artist}`; $("#now").textContent = m.label; }
// 音の大きさは、ステージ(スピーカーのあるあたり)からの距離で決める。近いほど大きく、高い音まではっきり。
// 目安: ステージの上 0.9 ／ 柵の前 0.5 ／ PA卓の横 0.25 ／ ドリンクカウンター 0.13(壁ごしなので、さらにこもる)
function musicLevel(x, z) { const d = Math.hypot(x - 3.4, z - 1.85), wall = x > 6.9, g = 0.95 / (1 + Math.pow(d / 3.2, 1.5)); return { gain: g * (wall ? 0.75 : 1), cut: wall ? 360 : 2600 + 8400 / (1 + Math.pow(d / 3.5, 2)) }; }

  if (m.ac) { const t = m.ac.currentTime; m.lp.frequency.setTargetAtTime(L2.cut, t, 0.25); m.gain.gain.setTargetAtTime(L2.gain, t, 0.25); } else if (m.el) m.el.volume = Math.min(1, L2.gain); }
async function setSound(v) { const m = music; m.on = v; const b = $("#snd"); b.textContent = v ? "音 ON" : "音 OFF"; b.setAttribute("aria-pressed", v ? "true" : "false"); try { localStorage.setItem("sixdog_real_sound", v ? "1" : "0"); } catch (e) { /* 保存できない端末 */ }

  if (!m.el) { m.el = new Audio(); m.el.preload = "none"; m.el.addEventListener("ended", playNext); m.el.addEventListener("error", () => { if (m.on) setTimeout(playNext, 800); });
    try { const AC = window.AudioContext || window.webkitAudioContext; m.ac = new AC(); const src = m.ac.createMediaElementSource(m.el); m.lp = m.ac.createBiquadFilter(); m.lp.type = "lowpass"; m.lp.Q.value = 0.6; m.gain = m.ac.createGain(); src.connect(m.lp); m.lp.connect(m.gain); m.gain.connect(m.ac.destination); m.an = m.ac.createAnalyser(); m.an.fftSize = 64; m.an.smoothingTimeConstant = 0.5; src.connect(m.an); } catch (e) { m.ac = null; m.el.volume = 0.5; } }

  musicZone(); if (m.el.src && m.el.paused && !m.el.ended) { m.el.play().catch(() => {}); $("#now").textContent = m.label || ""; } else if (!m.el.src) playNext(); }
$("#snd").onclick = () => setSound(!music.on);

/* ---- 待ち画面 ---- */
// 階段: 14段。読み込みが進むぶんだけ、上から順に灯る
const STEPS = 14; { const st = $("#stairs"); for (let i = 0; i < STEPS; i++) { const e = document.createElement("i"); e.style.left = i * 17 + "px"; e.style.top = 4 + i * 7.4 + "px"; st.appendChild(e); } }
const lightSteps = k => document.querySelectorAll("#stairs i").forEach((e, i) => e.classList.toggle("on", i < Math.round(k * STEPS)));
THREE.DefaultLoadingManager.onProgress = (url, n, total) => { if (!baked) lightSteps(n / total * 0.95); };
// チケット: 「○年前の今日、ここでは」を、新しい年から昔へ向かって1枚ずつめくっていく(つい見てしまうように)。公演の記録(data/events.json)から
let tkTimer = 0;
fetch("../data/events.json").then(r => r.json()).then(list => {
  const now = new Date(), doy = d => Math.round((new Date(2024, d.getMonth(), d.getDate()) - new Date(2024, 0, 1)) / 864e5), today = doy(now), byYear = new Map();
  for (const e of list) { if (!e.event_date || !e.title) continue; const d = new Date(e.event_date + "T00:00:00"); if (isNaN(d) || d > now) continue; let diff = Math.abs(doy(d) - today); diff = Math.min(diff, 366 - diff);
    const score = diff * 10 - Math.min((e.performers || []).length, 6), y = d.getFullYear(), cur = byYear.get(y); if (!cur || score < cur.score) byYear.set(y, { e, d, diff, score }); }
  const cards = [...byYear.values()].filter(c => c.diff <= 21).sort((a, b) => b.d - a.d);           // その年の、今日にいちばん近い公演(3週間以内)。新しい年から
  const tk = $("#tk"); if (!tk || !cards.length) return;
  const esc = x => String(x ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  let i = -1;
  const show = () => { i = (i + 1) % cards.length; const { e, d, diff } = cards[i], yrs = now.getFullYear() - d.getFullYear();   // 年の差で数える(同じ「○年前」が2枚続かないように)
    const ps = (e.performers || []).slice(0, 7), price = e.price_adv ? `前売 ¥${Number(e.price_adv).toLocaleString()}` : "";
    tk.innerHTML = `<div class="ago">${diff === 0 ? `${yrs}年前の今日、ここでは` : `${Math.max(yrs, 0)}年前の ${d.getMonth() + 1}月${d.getDate()}日、ここでは`}<span>${i + 1} / ${cards.length}</span></div>
      <div class="dt">${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")} <span style="font-size:17px">${esc(e.weekday || "")}</span></div>
      <div class="ti">${esc(e.title)}</div>${ps.length ? `<div class="ac">${ps.map(esc).join(" ／ ")}${(e.performers || []).length > ps.length ? " ほか" : ""}</div>` : ""}
      <div class="ft"><span>${e.open_time ? "OPEN " + esc(e.open_time) : ""}${e.start_time ? "　START " + esc(e.start_time) : ""}</span><span>${esc(price)}</span></div><i class="bar"></i>`;
    tk.style.setProperty("--rot", (i % 2 ? 1.1 : -1.2) + "deg"); tk.classList.remove("in"); void tk.offsetWidth; tk.classList.add("in"); };
  const run = () => { clearInterval(tkTimer); tkTimer = setInterval(show, 4200); };
  tk.hidden = false; show(); run(); tk.onclick = () => { show(); run(); };                           // 押すと次の年へ
}).catch(() => { /* 記録を読めなくても、待ち画面はそのまま進む */ });
THREE.DefaultLoadingManager.onLoad = () => { if (baked) return; bakeEnv(); baked = true;
  scene.traverse(o => { if (o.isLight && !o.isHemisphereLight) zoneLights[zoneOf(o.position.x, o.position.z)].push(o); }); zoneKey = ""; setZone();
  setQ(high); lightSteps(1);
  $("#lmsg").textContent = "入口に着きました。SiX-DOG は、この階段の下です。"; const b = $("#enter"); b.hidden = false; b.focus({ preventScroll: true });
  const open = snd => { clearInterval(tkTimer); startVoices(); const l = $("#load"); l.classList.add("out"); $("#hud").hidden = false; $("#bar").hidden = false; setTimeout(() => l.remove(), 950); setSound(snd);
    joyEl.hidden = !coarse; const how = $("#how"); how.hidden = false; how.textContent = coarse ? "左下のスティックで歩く・なぞって見回す・床をタップしても歩けます" : "W A S D / 矢印キーで歩く・ドラッグで見回す・床をクリックしても歩けます"; setTimeout(() => how.style.opacity = 0, 9000); };
  b.onclick = () => open(true); const mu = $("#enterMute"); mu.hidden = false; mu.onclick = () => open(false); };
let skip = false;
const frame = () => {
  if (!high && (skip = !skip)) return;
  const t = clock.getElapsedTime();
  if (move) { const k = Math.min(1, (performance.now() - move.t0) / 1400), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; EYE.lerpVectors(move.from, move.to, e); yaw = move.y0 + (move.y1 - move.y0) * e; pitch = move.p0 + (move.p1 - move.p0) * e; if (k >= 1) { move = null; nearStop(); } }
  camera.position.copy(EYE); camera.rotation.set(pitch, yaw, 0, "YXZ");
  readPulse();
  L.forEach((l, i) => { l.intensity = l.userData.base ?? (l.userData.base = l.intensity); l.intensity = l.userData.base * (0.8 + 0.12 * Math.sin(t * (0.7 + i * 0.13) + i * 2.1) + pulse * (i % 2 ? 0.75 : 0.45)); });
  beams.forEach((b, i) => b.material.uniforms.k.value = 0.75 + 0.2 * Math.sin(t * 0.5 + i) + pulse * 0.9);
  // 曲に合わせて小さく揺れる(170bpm の半分の速さ)
  const beat = t * Math.PI * 2 * (170 / 60) / 2;
  const dt = Math.min(0.05, t - (stepPicks.last ?? t)); stepPicks.last = t; walkStep(dt); if (frames % 10 === 0) setZone(); stepPicks(dt, t); stepBeer(t);
  people.forEach(o => { const b = Math.max(0, Math.sin(beat + o.ph)), r = o.react > t ? Math.min(1, (o.react - t) / 0.4) : 0; o.body.position.y = b * o.amp * (1 + pulse * 2.2) + r * Math.abs(Math.sin(t * 9 + o.ph)) * 0.09;
    o.arms.forEach(a => { a.sh0.rotation.x = a.raised ? a.base + Math.sin(beat * 2 + o.ph) * 0.16 : a.base + r * (2.7 - a.base); }); });
  grade.uniforms.time.value = t % 10;
  composer.render();
  if (frames % 12 === 0) musicZone();
  updateVoices(performance.now());
  if (++frames % 30 === 0) { const n = performance.now(); $("#fps").textContent = "　" + Math.round(30000 / (n - last)) + " fps"; last = n; }
};
renderer.setAnimationLoop(frame);
window.__frame = frame;   // 確認用: 画面が裏にあってコマが進まないときに、手でコマを進める
