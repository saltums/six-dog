const STEPS = 14; { const st = $("#stairs"); for (let i = 0; i < STEPS; i++) { const e = document.createElement("i"); e.style.left = i * 17 + "px"; e.style.top = 4 + i * 7.4 + "px"; st.appendChild(e); } }
const lightSteps = k => document.querySelectorAll("#stairs i").forEach((e, i) => e.classList.toggle("on", i < Math.round(k * STEPS)));
THREE.DefaultLoadingManager.onProgress = (url, n, total) => { if (!baked) lightSteps(n / total * 0.95); };
// チケット: ○年前の今日(なければいちばん近い日)にここであった公演。公演の記録(data/events.json)から
fetch("../data/events.json").then(r => r.json()).then(list => {
  const now = new Date(), doy = d => { const a = new Date(2024, d.getMonth(), d.getDate()); return Math.round((a - new Date(2024, 0, 1)) / 864e5); }, today = doy(now);
  let best = null, bd = 999;
  for (const e of list) { if (!e.event_date || !e.title) continue; const d = new Date(e.event_date + "T00:00:00"); if (isNaN(d) || d > now) continue; let diff = Math.abs(doy(d) - today); diff = Math.min(diff, 366 - diff);
    const score = diff * 10 - Math.min((e.performers || []).length, 6) - Math.random() * 3; if (score < bd) { bd = score; best = { e, d, diff }; } }
  if (!best) return; const { e, d, diff } = best, yrs = now.getFullYear() - d.getFullYear() - ((now.getMonth() < d.getMonth() || (now.getMonth() === d.getMonth() && now.getDate() < d.getDate())) ? 1 : 0), esc = x => String(x ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const ps = (e.performers || []).slice(0, 7), price = e.price_adv ? `前売 ¥${Number(e.price_adv).toLocaleString()}${e.price_note ? " " + e.price_note : ""}` : "";
  const tk = $("#tk"); if (!tk) return;
  tk.innerHTML = `<div class="ago">${diff === 0 ? `${yrs}年前の今日、ここでは` : `${Math.max(yrs, 0)}年前の ${d.getMonth() + 1}月${d.getDate()}日、ここでは`}</div>
    <div class="dt">${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")} <span style="font-size:17px">${esc(e.weekday || "")}</span></div>
    <div class="ti">${esc(e.title)}</div>${ps.length ? `<div class="ac">${ps.map(esc).join(" ／ ")}${(e.performers || []).length > ps.length ? " ほか" : ""}</div>` : ""}
    <div class="ft"><span>${e.open_time ? "OPEN " + esc(e.open_time) : ""}${e.start_time ? "　START " + esc(e.start_time) : ""}</span><span>${esc(price)}</span></div>`;
  tk.hidden = false;
}).catch(() => { /* 記録を読めなくても、待ち画面はそのまま進む */ });
THREE.DefaultLoadingManager.onLoad = () => { if (baked) return; bakeEnv(); baked = true;
  scene.traverse(o => { if (o.isLight && !o.isHemisphereLight) (o.position.x > 7 ? zoneLights.bar : zoneLights.hall).push(o); }); setZone(false);
  setQ(high); lightSteps(1);
  $("#lmsg").textContent = "地下に着きました。"; const b = $("#enter"); b.hidden = false; b.focus({ preventScroll: true });
  b.onclick = () => { const l = $("#load"); l.classList.add("out"); $("#hud").hidden = false; $("#bar").hidden = false; setTimeout(() => l.remove(), 950); }; };
let skip = false;
renderer.setAnimationLoop(() => {
  if (!high && (skip = !skip)) return;
  const t = clock.getElapsedTime();
  if (move) { const k = Math.min(1, (performance.now() - move.t0) / 1400), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; EYE.lerpVectors(move.from, move.to, e); yaw = move.y0 + (move.y1 - move.y0) * e; pitch = move.p0 + (move.p1 - move.p0) * e; if (k >= 1) { if (move.zone !== undefined) setZone(move.zone); move = null; } }
  camera.position.copy(EYE); camera.position.y += Math.sin(t * 0.6) * 0.004; camera.rotation.set(pitch, yaw, 0, "YXZ");
  L.forEach((l, i) => { l.intensity = l.userData.base ?? (l.userData.base = l.intensity); l.intensity = l.userData.base * (0.86 + 0.14 * Math.sin(t * (0.7 + i * 0.13) + i * 2.1)); });
  beams.forEach((b, i) => b.material.uniforms.k.value = 0.8 + 0.2 * Math.sin(t * 0.5 + i));
  // 曲に合わせて小さく揺れる(170bpm の半分の速さ)
  const beat = t * Math.PI * 2 * (170 / 60) / 2;
  const dt = Math.min(0.05, t - (stepPicks.last ?? t)); stepPicks.last = t; stepPicks(dt, t); stepBeer(t);
  people.forEach(o => { const b = Math.max(0, Math.sin(beat + o.ph)), r = o.react > t ? Math.min(1, (o.react - t) / 0.4) : 0; o.body.position.y = b * o.amp + r * Math.abs(Math.sin(t * 9 + o.ph)) * 0.09; o.hg.rotation.x = -b * 0.06 - r * 0.25;
    o.arms.forEach(a => { a.sh0.rotation.x = a.raised ? a.base + Math.sin(beat * 2 + o.ph) * 0.16 : a.base + r * (2.7 - a.base); }); });
  grade.uniforms.time.value = t % 10;
  composer.render();
  if (++frames % 30 === 0) { const n = performance.now(); $("#fps").textContent = "　" + Math.round(30000 / (n - last)) + " fps"; last = n; }
});
</script>
</body>
