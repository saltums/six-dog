  fragmentShader: "uniform sampler2D tDiffuse; uniform float time; varying vec2 vUv; float r(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)) + time) * 43758.5453); } void main(){ vec2 d = vUv - 0.5; float r2 = dot(d,d); vec2 o = d * r2 * 0.01; vec3 c = vec3(texture2D(tDiffuse, vUv + o).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv - o).b); c = mix(c, c*c*(3.0-2.0*c), 0.25); c *= mix(1.0, 0.6, smoothstep(0.14, 0.7, r2)); c += (r(vUv*vec2(1600.0,900.0)) - 0.5) * 0.035; gl_FragColor = vec4(c, 1.0); }" });
composer.addPass(grade);
function size() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); composer.setSize(w, h); camera.aspect = w / h; camera.fov = h > w ? 86 : 64; camera.updateProjectionMatrix(); }
addEventListener("resize", size); size();

/* ---- 見回す ---- */
let yaw = 0, pitch = 0.03, drag = null;
const cv = renderer.domElement;
cv.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY, yaw, pitch }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", e => { if (!drag) return; yaw = drag.yaw + (e.clientX - drag.x) * 0.004; pitch = Math.max(-0.7, Math.min(0.6, drag.pitch + (e.clientY - drag.y) * 0.004)); });
// 行き先: 押すと、その場所へすっと移る
let move = null;
const go = i => { const st = STOPS[i]; move = { t0: performance.now(), from: EYE.clone(), to: new THREE.Vector3(...st.p), y0: yaw, y1: st.yaw + Math.round((yaw - st.yaw) / (Math.PI * 2)) * Math.PI * 2, p0: pitch, p1: st.pitch }; document.querySelectorAll("#bar [data-i]").forEach(b => b.classList.toggle("on", +b.dataset.i === i)); };
document.querySelectorAll("#bar [data-i]").forEach(b => b.onclick = () => go(+b.dataset.i));
// 画質: 高(陰と影を計算)／軽(スマホ向け。陰と影を止めて、解像度を下げる)
let high = !matchMedia("(pointer:coarse)").matches;
const setQ = v => { high = v; gtao.enabled = v; renderer.shadowMap.enabled = v; L.forEach(l => l.castShadow = v); renderer.setPixelRatio(Math.min(devicePixelRatio || 1, v ? 1.5 : 1)); scene.traverse(o => { if (o.material) o.material.needsUpdate = true; }); size(); $("#q").textContent = "画質: " + (v ? "高" : "軽"); };
$("#q").onclick = () => setQ(!high);
cv.addEventListener("pointerup", () => drag = null);

const clock = new THREE.Clock(); let frames = 0, last = performance.now(), baked = false;
THREE.DefaultLoadingManager.onLoad = () => { if (baked) return; bakeEnv(); baked = true; $("#load").remove(); $("#hud").hidden = false; $("#bar").hidden = false; setQ(high); };
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  if (move) { const k = Math.min(1, (performance.now() - move.t0) / 1400), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; EYE.lerpVectors(move.from, move.to, e); yaw = move.y0 + (move.y1 - move.y0) * e; pitch = move.p0 + (move.p1 - move.p0) * e; if (k >= 1) move = null; }
  camera.position.copy(EYE); camera.position.y += Math.sin(t * 0.6) * 0.004; camera.rotation.set(pitch, yaw, 0, "YXZ");
  L.forEach((l, i) => { l.intensity = l.userData.base ?? (l.userData.base = l.intensity); l.intensity = l.userData.base * (0.86 + 0.14 * Math.sin(t * (0.7 + i * 0.13) + i * 2.1)); });
  beams.forEach((b, i) => b.material.uniforms.k.value = 0.8 + 0.2 * Math.sin(t * 0.5 + i));
  grade.uniforms.time.value = t % 10;
  composer.render();
  if (++frames % 30 === 0) { const n = performance.now(); $("#fps").textContent = "　" + Math.round(30000 / (n - last)) + " fps"; last = n; }
});
</script>
