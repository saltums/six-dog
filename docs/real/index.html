  const torsoG = new THREE.LatheGeometry([[0, 0], [0.15, 0.005], [0.165, 0.06], [0.16, 0.2], [0.152, 0.3], [0.165, 0.4], [0.195, 0.48], [0.208, 0.53], [0.19, 0.575], [0.13, 0.605], [0.075, 0.625], [0.055, 0.64], [0, 0.64]].map(([x, y]) => new THREE.Vector2(x, y)), 28);
  const cap = (r, len, mat) => { const g = new THREE.CapsuleGeometry(r, len, 6, 14); g.translate(0, -len / 2 - r * 0.2, 0); return new THREE.Mesh(g, mat); };
  const person = (x, z) => {
    const h = 1.56 + rnd() * 0.26, k = h / 1.7, root = new THREE.Group(); root.position.set(x, 0, z); root.rotation.y = (rnd() - 0.5) * 0.5; add(root);
    const body = new THREE.Group(); root.add(body);
    const cl = pick(CL), pt = pick(PT), sk = pick(SK), hr = pick(HR), lean = (rnd() - 0.5) * 0.09, legL = 0.82 * k, wide = 0.92 + rnd() * 0.2;
    body.rotation.z = lean;
    // 脚(片方に体重を乗せている)、靴
    [-1, 1].forEach(sd => { const l = cap(0.074 * k, legL - 0.15, pt); l.position.set(sd * 0.085 * k, legL, 0); l.rotation.z = sd * 0.03 - lean * 0.8; l.scale.z = 0.92; body.add(l);
      const shoe = new THREE.Mesh(new RoundedBoxGeometry(0.1 * k, 0.07, 0.27 * k, 2, 0.025), new THREE.MeshStandardMaterial({ color: 0x0c0c0d, roughness: 0.6 })); shoe.position.set(sd * 0.09 * k, 0.035, -0.04); shoe.rotation.y = sd * 0.12; body.add(shoe); });
    const hip = new THREE.Mesh(new THREE.SphereGeometry(0.165 * k, 18, 12), pt); hip.scale.set(wide, 0.62, 0.72); hip.position.y = legL + 0.02; body.add(hip);
    const torso = new THREE.Mesh(torsoG, cl); torso.scale.set(k * wide, k, k * 0.6); torso.position.y = legL - 0.02; body.add(torso);
    const top = legL - 0.02 + 0.64 * k;
    // 首、頭、耳、髪
    const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.047 * k, 0.055 * k, 0.1 * k, 14), sk); neck.position.y = top + 0.03 * k; body.add(neck);
    const hg = new THREE.Group(); hg.position.y = top + 0.15 * k; hg.rotation.z = (rnd() - 0.5) * 0.12; hg.rotation.x = (rnd() - 0.5) * 0.1; body.add(hg);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.098 * k, 22, 18), sk); head.scale.set(0.88, 1.12, 1.0); hg.add(head);
    const dark = new THREE.MeshStandardMaterial({ color: 0x1a120e, roughness: 0.7 });
    [-1, 1].forEach(sd => { const eye = new THREE.Mesh(new THREE.SphereGeometry(0.013 * k, 10, 8), dark); eye.scale.set(1.5, 0.75, 0.5); eye.position.set(sd * 0.033 * k, 0.012 * k, -0.088 * k); hg.add(eye);
      const brow = new THREE.Mesh(new THREE.BoxGeometry(0.034 * k, 0.006 * k, 0.01 * k), hr); brow.position.set(sd * 0.034 * k, 0.034 * k, -0.09 * k); brow.rotation.z = -sd * 0.12; hg.add(brow); });
    { const nose = new THREE.Mesh(new THREE.SphereGeometry(0.015 * k, 10, 8), sk); nose.scale.set(0.8, 1.5, 1.1); nose.position.set(0, -0.012 * k, -0.098 * k); hg.add(nose);
      const mouth = new THREE.Mesh(new THREE.BoxGeometry(0.036 * k, 0.005 * k, 0.008 * k), new THREE.MeshStandardMaterial({ color: 0x6a3a34, roughness: 0.6 })); mouth.position.set(0, -0.052 * k, -0.086 * k); hg.add(mouth); }
    [-1, 1].forEach(sd => { const ear = new THREE.Mesh(new THREE.SphereGeometry(0.022 * k, 10, 8), sk); ear.scale.set(0.45, 1, 0.75); ear.position.set(sd * 0.086 * k, -0.005, 0.005); hg.add(ear); });
    const style = rnd(), hair = new THREE.Mesh(new THREE.SphereGeometry(0.105 * k, 22, 18), hr); hair.scale.set(0.93, 1.1, 1.02); hair.position.set(0, 0.012 * k, 0.024 * k); hg.add(hair);
    if (style < 0.3) { const back = cap(0.085 * k, (0.14 + rnd() * 0.2) * k, hr); back.position.set(0, 0.02 * k, 0.05 * k); back.scale.z = 0.55; hg.add(back); }
    else if (style < 0.42) { const bun = new THREE.Mesh(new THREE.SphereGeometry(0.043 * k, 12, 10), hr); bun.position.set(0, 0.115 * k, 0.045 * k); hg.add(bun); }
    else if (style < 0.5) { const brim = new THREE.Mesh(new THREE.CylinderGeometry(0.108 * k, 0.11 * k, 0.07 * k, 20), pick(CL)); brim.position.set(0, 0.07 * k, 0.01); hg.add(brim); }
    if (rnd() < 0.32) { const tw = new THREE.Mesh(new THREE.TorusGeometry(0.078 * k, 0.027 * k, 8, 18), pick(TW)); tw.rotation.x = Math.PI / 2 + 0.22; tw.scale.set(1.22, 1, 1); tw.position.set(0, top + 0.03 * k, 0.004); body.add(tw); }
    // 腕(肩の丸みからつなぐ)。下ろす／上げる／ドリンクを持つ
    const sleeve = rnd() < 0.5 ? cl : sk, raise = rnd() < 0.28 ? (rnd() < 0.5 ? -1 : 1) : 0, hold = !raise && rnd() < 0.3 ? (rnd() < 0.5 ? -1 : 1) : 0, arms = [];
    [-1, 1].forEach(sd => { const sh0 = new THREE.Group(); sh0.position.set(sd * 0.188 * k * wide, top - 0.105 * k, 0); body.add(sh0);
      const ball = new THREE.Mesh(new THREE.SphereGeometry(0.06 * k, 12, 10), cl); sh0.add(ball);
      const up = cap(0.05 * k, 0.24 * k, cl); sh0.add(up);
      const fore = cap(0.04 * k, 0.22 * k, sleeve); fore.position.y = -0.3 * k; up.add(fore);
      const hand = new THREE.Mesh(new THREE.SphereGeometry(0.042 * k, 10, 8), sk); hand.scale.set(0.8, 1.2, 0.55); hand.position.y = -0.31 * k; fore.add(hand);
      if (raise === sd) { sh0.rotation.x = 2.6 + rnd() * 0.35; sh0.rotation.z = sd * 0.14; fore.rotation.x = 0.3; }
      else if (hold === sd) { sh0.rotation.x = 0.25; sh0.rotation.z = sd * 0.08; fore.rotation.x = 1.45; const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.036, 0.027, 0.1, 14), new THREE.MeshPhysicalMaterial({ color: 0xe9eef2, roughness: 0.1, transmission: 0.7, thickness: 0.01, transparent: true, opacity: 0.6 })); cup.position.set(0, -0.33 * k, -0.04); cup.rotation.x = -1.45; fore.add(cup); }
      else { sh0.rotation.z = sd * (0.09 + rnd() * 0.05); sh0.rotation.x = 0.03 + rnd() * 0.14; fore.rotation.x = 0.1 + rnd() * 0.35; }
      arms.push({ sh0, raised: raise === sd, base: sh0.rotation.x }); });
    root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    people.push({ root, body, hg, arms, ph: rnd() * 6, amp: 0.01 + rnd() * 0.02, lean, react: 0 });
  };
  // 立ち位置(行き先に立つ場所のまわりは空ける)
  [[1.0, 4.5], [1.8, 4.42], [2.55, 4.5], [4.35, 4.45], [5.05, 4.4], [5.8, 4.5], [0.9, 5.25], [1.7, 5.45], [2.5, 5.15], [3.3, 5.6], [4.2, 5.25], [5.1, 5.55], [5.9, 5.35], [1.2, 6.3], [2.2, 6.5], [3.6, 6.4], [4.6, 6.6], [1.6, 7.3], [0.8, 8.2], [5.6, 6.2]].forEach(([x, z]) => person(x + (rnd() - 0.5) * 0.14, z + (rnd() - 0.5) * 0.14));
}

/* ---- 床や金属に映る景色(場面そのものから一度だけ作る) ---- */
const pm = new THREE.PMREMGenerator(renderer);
function bakeEnv() { const rt = pm.fromScene(scene, 0.02, 0.1, 30); scene.environment = rt.texture; }

/* ---- 仕上げ ---- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const gtao = new GTAOPass(scene, camera, 2, 2); gtao.output = GTAOPass.OUTPUT.Default; gtao.updateGtaoMaterial({ radius: 0.45, distanceExponent: 1.4, thickness: 1.2, scale: 1.25, samples: 12 }); composer.addPass(gtao);
const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.32, 0.5, 0.93); composer.addPass(bloom);
composer.addPass(new OutputPass());
const grade = new ShaderPass({ uniforms: { tDiffuse: { value: null }, time: { value: 0 } },
  vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
  fragmentShader: "uniform sampler2D tDiffuse; uniform float time; varying vec2 vUv; float r(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)) + time) * 43758.5453); } void main(){ vec2 d = vUv - 0.5; float r2 = dot(d,d); vec2 o = d * r2 * 0.01; vec3 c = vec3(texture2D(tDiffuse, vUv + o).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv - o).b); c = mix(c, c*c*(3.0-2.0*c), 0.25); c *= mix(1.0, 0.6, smoothstep(0.14, 0.7, r2)); c += (r(vUv*vec2(1600.0,900.0)) - 0.5) * 0.035; gl_FragColor = vec4(c, 1.0); }" });
composer.addPass(grade);
function size() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); composer.setSize(w, h); camera.aspect = w / h; camera.fov = h > w ? 86 : 64; camera.updateProjectionMatrix(); }
addEventListener("resize", size); size();

/* ---- 見回す ---- */
let yaw = 0, pitch = 0.03, drag = null;
const cv = renderer.domElement;
let down = null;
cv.addEventListener("pointerdown", e => { down = { x: e.clientX, y: e.clientY }; drag = { x: e.clientX, y: e.clientY, yaw, pitch }; try { cv.setPointerCapture(e.pointerId); } catch (err) { /* つかめない端末 */ } });
cv.addEventListener("pointermove", e => { if (!drag) return; yaw = drag.yaw + (e.clientX - drag.x) * 0.004; pitch = Math.max(-0.7, Math.min(0.6, drag.pitch + (e.clientY - drag.y) * 0.004)); });
// 行き先: 押すと、その場所へすっと移る
let move = null;
const go = i => { const st = STOPS[i]; move = { t0: performance.now(), from: EYE.clone(), to: new THREE.Vector3(...st.p), y0: yaw, y1: st.yaw + Math.round((yaw - st.yaw) / (Math.PI * 2)) * Math.PI * 2, p0: pitch, p1: st.pitch }; document.querySelectorAll("#bar [data-i]").forEach(b => b.classList.toggle("on", +b.dataset.i === i)); at = i; $("#tip").textContent = i === 3 ? (thrown ? `投げたピック ${thrown} 枚` : "画面を軽く押すと、客席へピックを投げます") : ""; };
document.querySelectorAll("#bar [data-i]").forEach(b => b.onclick = () => go(+b.dataset.i));
// 画質: 高(陰と影を計算)／軽(スマホ向け。陰と影を止めて、解像度を下げる)
let high = !matchMedia("(pointer:coarse)").matches;
const setQ = v => { high = v; gtao.enabled = v; renderer.shadowMap.enabled = v; L.forEach(l => l.castShadow = v); renderer.setPixelRatio(Math.min(devicePixelRatio || 1, v ? 1.5 : 1)); scene.traverse(o => { if (o.material) o.material.needsUpdate = true; }); size(); $("#q").textContent = "画質: " + (v ? "高" : "軽"); };
$("#q").onclick = () => setQ(!high);
const release = e => { const tap = down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 8; down = null; drag = null; if (tap && at === 3) throwPick(e.clientX, e.clientY); };
cv.addEventListener("pointerup", release); cv.addEventListener("pointercancel", () => { down = null; drag = null; });
/* ---- 遊び: ステージの上から、客席へピックを投げる ---- */
let at = 0, thrown = 0; const picks = [], PICK_COL = [0x7a3d1d, 0xe9e6dc, 0xc9433f, 0xd8b23a, 0x2f5fb8, 0x1c1c1e];
const pickG = (() => { const sh2 = new THREE.Shape(), r = 0.016; sh2.moveTo(0, -r * 1.25); sh2.quadraticCurveTo(r * 1.15, -r * 0.2, r * 0.95, r * 0.75); sh2.quadraticCurveTo(0, r * 1.25, -r * 0.95, r * 0.75); sh2.quadraticCurveTo(-r * 1.15, -r * 0.2, 0, -r * 1.25); return new THREE.ExtrudeGeometry(sh2, { depth: 0.0012, bevelEnabled: false, curveSegments: 8 }); })();
const ray = new THREE.Raycaster();
function throwPick(cx, cy) {
  ray.setFromCamera(new THREE.Vector2(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1), camera);
  const d = ray.ray.direction.clone(), m = new THREE.Mesh(pickG, new THREE.MeshStandardMaterial({ color: PICK_COL[thrown % PICK_COL.length], roughness: 0.35, envMapIntensity: 1 }));
  m.scale.setScalar(1.6); m.castShadow = true; m.position.copy(camera.position).addScaledVector(d, 0.35); m.position.y -= 0.25; add(m);
  const power = 5.2 + Math.random() * 1.6; picks.push({ m, v: new THREE.Vector3(d.x * power, d.y * power + 2.6, d.z * power), w: new THREE.Vector3(Math.random() * 20 - 10, Math.random() * 24 - 12, Math.random() * 20 - 10), live: true });
  thrown++; $("#tip").textContent = `投げたピック ${thrown} 枚`;
  if (picks.length > 60) { const o = picks.shift(); scene.remove(o.m); }
}
function stepPicks(dt, t) { for (const k of picks) { if (!k.live) continue;
    k.v.y -= 9.8 * dt; k.v.multiplyScalar(1 - 0.35 * dt); k.m.position.addScaledVector(k.v, dt); k.m.rotation.x += k.w.x * dt; k.m.rotation.y += k.w.y * dt; k.m.rotation.z += k.w.z * dt;
    const p = k.m.position, ground = p.z < 3.7 ? SY : 0;
    // 近くを通ると、その人が手を伸ばして跳ねる
    if (p.y < 2.1 && p.y > 0.9) for (const o of people) if (Math.hypot(o.root.position.x - p.x, o.root.position.z - p.z) < 0.75) o.react = t + 1.4;
    if (p.x < 0.1 || p.x > 6.7) { k.v.x *= -0.3; p.x = Math.max(0.1, Math.min(6.7, p.x)); } if (p.z > 9.0) { k.v.z *= -0.3; p.z = 9.0; }
    if (p.y <= ground + 0.004) { p.y = ground + 0.004; if (Math.abs(k.v.y) > 1.2) { k.v.y *= -0.28; k.v.x *= 0.5; k.v.z *= 0.5; } else { k.live = false; k.m.rotation.set(-Math.PI / 2, 0, Math.random() * 6); } } } }

const clock = new THREE.Clock(); let frames = 0, last = performance.now(), baked = false;
THREE.DefaultLoadingManager.onLoad = () => { if (baked) return; bakeEnv(); baked = true; $("#load").remove(); $("#hud").hidden = false; $("#bar").hidden = false; setQ(high); };
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  if (move) { const k = Math.min(1, (performance.now() - move.t0) / 1400), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; EYE.lerpVectors(move.from, move.to, e); yaw = move.y0 + (move.y1 - move.y0) * e; pitch = move.p0 + (move.p1 - move.p0) * e; if (k >= 1) move = null; }
  camera.position.copy(EYE); camera.position.y += Math.sin(t * 0.6) * 0.004; camera.rotation.set(pitch, yaw, 0, "YXZ");
  L.forEach((l, i) => { l.intensity = l.userData.base ?? (l.userData.base = l.intensity); l.intensity = l.userData.base * (0.86 + 0.14 * Math.sin(t * (0.7 + i * 0.13) + i * 2.1)); });
  beams.forEach((b, i) => b.material.uniforms.k.value = 0.8 + 0.2 * Math.sin(t * 0.5 + i));
  // 曲に合わせて小さく揺れる(170bpm の半分の速さ)
  const beat = t * Math.PI * 2 * (170 / 60) / 2;
  const dt = Math.min(0.05, t - (stepPicks.last ?? t)); stepPicks.last = t; stepPicks(dt, t);
  people.forEach(o => { const b = Math.max(0, Math.sin(beat + o.ph)), r = o.react > t ? Math.min(1, (o.react - t) / 0.4) : 0; o.body.position.y = b * o.amp + r * Math.abs(Math.sin(t * 9 + o.ph)) * 0.09; o.hg.rotation.x = -b * 0.06 - r * 0.25;
    o.arms.forEach(a => { a.sh0.rotation.x = a.raised ? a.base + Math.sin(beat * 2 + o.ph) * 0.16 : a.base + r * (2.7 - a.base); }); });
  grade.uniforms.time.value = t % 10;
  composer.render();
  if (++frames % 30 === 0) { const n = performance.now(); $("#fps").textContent = "　" + Math.round(30000 / (n - last)) + " fps"; last = n; }
});
</script>
